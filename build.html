<main class="wrap" style="padding-bottom:40px"><h2 style="margin-top:36px">Create App</h2><p class="sub">Pick your targets and download a ready-to-build project zip.</p>
<div class="f"><label>App name<input type="text" id="name" value="My Qolx App"></label><label>Bundle ID<input type="text" id="appid" value="com.example.myqolxapp"></label><label>Version<input type="text" id="ver" value="1.0.0"></label></div>
<div class="chk"><label><input type="checkbox" name="t" value="web" checked>Web / PWA</label><label><input type="checkbox" name="t" value="android" checked>Android (APK)</label><label><input type="checkbox" name="t" value="ios">iOS</label><label><input type="checkbox" name="t" value="windows" checked>Windows (EXE)</label><label><input type="checkbox" name="t" value="mac">macOS</label><label><input type="checkbox" name="t" value="linux">Linux</label></div>
<textarea id="code" spellcheck="false" style="width:100%;height:300px;background:var(--bg2);color:#d9d6ff;border:1px solid var(--bd);border-radius:16px;padding:16px;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace" aria-label="Qolx code"></textarea>
<div class="tb"><button class="btn p" id="go"><i data-i="download"></i>Generate project zip</button><span id="status"></span></div>
<p class="note">The zip contains your source, compiled app, and per-platform projects with a README of exact build commands. Native builds need that platform's toolchain.</p></main>
